<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AC Financial Planner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-success px-3 position-relative">

<div class="logo-area">
    <img src="/static/dog.png" class="dog-face">
    <span class="fw-bold text-white">AC Financial Planner</span>
</div>

<div class="nav-face-wrapper">
    <img src="/static/dog2.png" class="dog2-overlay">

    <div class="nav-eyes">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
    </div>
</div>

{% if current_user.is_authenticated %}
<div class="user-panel">

    <div class="username">
        Welcome {{ current_user.username }}
    </div>

    <div class="nav-buttons">
        <a href="/">Home</a>
        <a href="/transactions">Transactions</a>
        <a href="/analytics">Analytics</a>
        <a href="/profile">Profile</a>
        <a href="/goals">Goals</a>
        <a href="/logout" class="logout">Logout</a>
    </div>

    <div class="currency-box">
        <button onclick="setCurrency('$')">$</button>
        <button onclick="setCurrency('₽')">₽</button>
    </div>

</div>
{% endif %}

</nav>

<div id="popup"></div>

<script>
function setCurrency(cur){
    fetch("/set_currency/" + cur).then(()=>location.reload());
}

function showPopup(msg){
    if(!msg) return;
    let p=document.getElementById("popup");
    p.innerHTML=msg;
    p.style.display="block";
    setTimeout(()=>p.style.display="none",2500);
}
</script>

{% if popup %}
<script>showPopup("{{ popup }}");</script>
{% endif %}

<div class="container mt-4">
{% block content %}{% endblock %}
</div>

<!-- ✅ FIX: DOG EYES MOVEMENT SCRIPT -->
<script src="{{ url_for('static', filename='dog.js') }}"></script>

</body>
</html>
